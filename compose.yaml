services:
  # Здесь будут описаны сервисы, когда они понадобятся

  rest-service:
    build: .
    ports:
      - "8081:8080"
    networks:
      - backend

  front:
    image: node:16
    volumes:
      - ./front:/app
    working_dir: /app
    command: ["npm", "start"]
    ports:
      - "3000:3000"
    networks:
      - backend

  app:
    build: .
    ports:
      - "8082:8080"

networks:
  backend:
